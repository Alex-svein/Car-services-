<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-5">
<h1 class="text-2xl font-black">ALEX MOTORS TEST</h1>
<button onclick="document.getElementById('layer').classList.remove('hidden')" class="bg-[#FF4D00] mt-10 w-full py-4 rounded-full font-black">BOOK NOW - TAP ME</button>

<div id="layer" class="hidden fixed bottom-0 left-0 right-0 bg-white text-black rounded-t-[30px] p-6 z-50">
<div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto"></div>
<h2 class="text-xl font-black mt-4">This is layer!</h2>
<p class="text-sm text-gray-600 mt-2">If you see this, layers work. Swipe down is next.</p>
<button onclick="document.getElementById('layer').classList.add('hidden')" class="w-full bg-black text-white py-4 rounded-full mt-6">CLOSE</button>
</div>

</body>
</html>
